# 测试专用配置：会遮蔽 src/main/resources/application.yaml。

# 不声明 spring.config.import，测试不连 Nacos。

# 真实密钥由 application-local.yaml 覆盖，这里只放非敏感值和占位符。
spring:
  application:
    name: ai-service

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
      file-size-threshold: 1MB
      location: ${java.io.tmpdir}/jotang-ai-upload-test

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jotang_ai}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  ai:
    tools:
      limits:
        on-limit-exceeded: return-error-response
        max-calls-per-tool-default: 4
        max-total-tool-calls: 6
    openai:
      api-key: ${JOTANG_AI_API_KEY:test}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-flash
        timeout: 60s
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

jwt:
  secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=

aliyun:
  oss:
    access-key-id: ${JOTANG_OSS_ACCESS_KEY_ID:test}
    access-key-secret: ${JOTANG_OSS_ACCESS_KEY_SECRET:test}
    endpoint-server: oss-cn-chengdu.aliyuncs.com
    endpoint-browser: oss-cn-chengdu.aliyuncs.com
    bucket-note: jotang-note-dev
    bucket-avatar: jotang-avatar-dev

jotang:
  internal:
    token: dev-internal-token
  gateway:
    token: dev-gateway-token
