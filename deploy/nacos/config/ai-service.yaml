# ai-service 专属配置。
# 密钥只写占位符，实际值由环境变量或 application-local.yaml 提供。
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
      file-size-threshold: 1MB
      location: ${JOTANG_AI_UPLOAD_TMP:${java.io.tmpdir}/jotang-ai-upload}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jotang_ai}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  # 与单体同一套 DeepSeek/OpenAI 兼容配置
  ai:
    tools:
      limits:
        on-limit-exceeded: return-error-response
        max-calls-per-tool-default: 4
        max-total-tool-calls: 6
    openai:
      api-key: ${JOTANG_AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-flash
        timeout: 60s
        parallel-tool-calls: false
      # embedding 走硅基流动，对话仍用 DeepSeek；模型级配置覆盖上面的地址和 key
      embedding:
        api-key: ${JOTANG_EMBEDDING_API_KEY:}
        base-url: ${JOTANG_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
        model: ${JOTANG_EMBEDDING_MODEL:BAAI/bge-m3}
    model:
      chat: openai
      embedding: openai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:127.0.0.1}
        port: ${QDRANT_PORT:6334}       # gRPC，不是 6333
        collection-name: university_docs
        initialize-schema: true
        use-tls: false

jotang:
  ai:
    kb:
      # 相对路径按进程工作目录解析；从 jotang-ai-app 启动时即 jotang-ai-app/data/kb
      dir: ${JOTANG_AI_KB_DIR:./data/kb}
