# jotang-note 站点。装到 /etc/nginx/sites-available/jotang 后软链到 sites-enabled。
# 当前只有 IP、没有域名，故用 default_server 兜底；将来上域名改 server_name 即可。

server {
    listen 80 default_server;
    server_name _;

    root /var/www/jotang;
    index index.html;

    # 必须 ≥ 后端 spring.servlet.multipart.max-request-size（110MB）。
    # 设小了请求在 Nginx 就被 413 拦下，后端那个上限形同虚设。两处是一对，改一个必须改另一个。
    client_max_body_size 110m;

    location /api/ {
        # 不带尾斜杠、也不 rewrite：后端接口本身就带 /api 前缀，原样透传即可。
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 请求体不落 Nginx 临时盘，大文件直接流给后端
        proxy_request_buffering off;
        # 单文件可达 100MB，默认 60s 不够
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 产物文件名带内容哈希，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端是 SPA，/reset-password 这类路由要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
