# 生产用的 MySQL、Redis 与 RabbitMQ。与根目录那份开发用的区别：
# 多了 MySQL、端口只绑回环、Redis 强制密码、容器名带 jotang- 前缀。
#
# 密码从同目录 .env 读取（Compose 自动加载），模板见 .env.example。
#
# 目标机器是 2 核 2G，三个容器的内存都做了压制，改动前先看 docs/部署运维.md §2 的内存账。

services:
  mysql:
    image: mysql:8.4
    container_name: jotang-mysql
    restart: unless-stopped
    # 2G 的机器上必须显式压住 buffer pool：默认按宿主机内存自算，不压的话这一个容器就能吃掉 400MB+。
    # performance-schema 关掉能再省几十 MB，代价是 8.0+ 的性能视图查不到（本项目用不上）。
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 deploy/.env 或未设置 MYSQL_ROOT_PASSWORD}
      # 下面三项**只在数据卷为空时生效**（即首次启动）。之后改这里不会改库里的账号密码，
      # 要改得进容器用 SQL，或删卷重来（会丢数据）。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jotang_note}
      MYSQL_USER: ${MYSQL_USER:-jotang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?缺少 deploy/.env 或未设置 MYSQL_PASSWORD}
    ports:
      # 只绑回环：应用在同一台机器上，走 127.0.0.1:3306 即可，安全组不要开 3306
      - "127.0.0.1:3306:3306"
    volumes:
      # 与 Redis 不同，这里是**唯一的一份数据**，卷必须留
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 密码取自容器自身环境变量；首次启动要初始化系统库，start_period 给足
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: jotang-rabbitmq
    restart: unless-stopped
    # 只绑 127.0.0.1：5672 与 15672 都不该对公网开放，安全组也不要开。
    # 要看管理台就用隧道：ssh -L 15672:127.0.0.1:15672 <user>@<IP>
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?缺少 deploy/.env 或未设置 RABBITMQ_USER}
      # :? 让变量缺失时直接报错，而不是静默起一个连不上的实例
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 deploy/.env 或未设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # 只探节点是否响应。不探 15672：管理插件比 AMQP 后起，探端口会误判不健康。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要初始化 mnesia 库，这段失败不计入 retries
      start_period: 40s

  redis:
    image: redis:8-alpine
    container_name: jotang-redis
    restart: unless-stopped
    # 本项目的 Redis 只是笔记详情读缓存（note:meta:{noteId}），掉了重新查库即可，故不挂卷。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?缺少 deploy/.env 或未设置 REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      # 只为下面的 healthcheck 取值，redis-server 自己不读这个变量
      REDIS_PASSWORD: ${REDIS_PASSWORD:?缺少 deploy/.env 或未设置 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  rabbitmq-data:
