spring:
  application:
    name: jotang-note

  # multipart 上传参数，取值与 Nginx 侧必须对齐：
  #   Nginx 的 client_max_body_size 必须 ≥ 这里的 max-request-size。请求体 = 100MB 文件
  #   + multipart 边界与元数据 > 100MB，把 Nginx 也设成 100m 会让请求在 Nginx 就被 413 拦下，
  #   后端这个 110MB 形同虚设。这两处是同一个限制的两个副本，改一个必须改另一个。
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
      # 超过 1MB 的部件落磁盘而不是留在堆里：单文件可达 100MB，全压在堆上会打爆内存
      file-size-threshold: 1MB
      # 专用中转目录，便于定期清理残留（§6.1）。默认取系统临时目录下的子目录，
      # 部署时可用 JOTANG_UPLOAD_TMP 指到独立分区——上传中转会吃磁盘，与数据盘分开更安全
      location: ${JOTANG_UPLOAD_TMP:${java.io.tmpdir}/jotang-upload}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jotang_note}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 库表与基础数据随应用启动初始化；脚本均为幂等。
  sql:
    init:
      mode: always
      encoding: UTF-8

  # Redis
  # 前缀是 spring.data.redis，不是 spring.redis。后者在 Boot 3.0 起被标为 error 级废弃
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本机 WSL 里的 Redis 没设密码；生产必须配 REDIS_PASSWORD 并删掉这个默认空值
      password: ${REDIS_PASSWORD:}

  # 邮件（SMTP）
  #
  # host 这一项**必须配**：MailSenderAutoConfiguration 的生效条件就是 spring.mail.host 存在，
  # 少了它 JavaMailSender 这个 Bean 根本不会创建，于是任何注入它的类都让整个上下文起不来——
  # 包括全部测试。这与 JOTANG_AI_API_KEY「可以留空、只是调用时失败」**性质相反**，
  # 不要照抄上面 AI 那段的注释。默认值指向 QQ 邮箱，本机不额外配置也能启动。
  mail:
    host: ${JOTANG_MAIL_HOST:smtp.qq.com}
    port: ${JOTANG_MAIL_PORT:465}
    username: ${JOTANG_MAIL_USERNAME:}
    password: ${JOTANG_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # QQ 的 465 是隐式 SSL（一连上就走加密），不是 587 那种 STARTTLS。
          # 换端口必须同时换这个开关，否则两边对握手方式的预期对不上，直接连不通
          ssl:
            enable: true
          # 三个超时都要显式设：JavaMail 的默认值是「无限等待」，而当前发信是**同步**的、
          # 引入消息队列之后超时仍然要留（消费者被卡住同样要能自己挣脱）
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # RabbitMQ
  # Docker Compose 会自动加载同目录的 .env，但Spring Boot不会。
  # 所以只靠 .env 是不够的。compose起来了不代表应用连得上。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}
    template:
      # 路由不到任何队列时让 Broker 把消息退回，而不是静默丢弃。
      # 配套的退回回调在 RabbitConfig#mailReturnsLogger（退回时记 error 日志）
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 一次只预取一条：被卡住的那条是唯一一条未 ack 的
        prefetch: 1
        # **Spring 默认是 true，必须显式改掉。** true 的后果：消费抛异常时消息被无退避地
        # 立刻重投，同一条毒消息在队列里反复打转——热点循环、队列深度永不下降、
        # 消费线程被它一个人占死。false 之后重试耗尽即 reject，配合队列上的
        # x-dead-letter-exchange 进死信队列（RabbitConfig#passwordResetQueue）
        default-requeue-rejected: false
        retry:
          enabled: true
          # 这一项在 Boot 4 里叫 max-retries，不是老教程里的 max-attempts。
          #
          # 语义是重试次数，不含首次：这里是 1 次初始 + 3 次重试 = 最多投递 4 次。
          # 配合下面的退避就是 2s → 4s → 8s，最坏一条消息占住消费者约 14 秒。
          max-retries: 3
          initial-interval: 2s
          multiplier: 2.0
          max-interval: 10s

  # AI。
  # DeepSeek 提供 OpenAI 兼容接口，故复用 openai starter。
  # 六个模态的自动配置默认全都加载（每个的 matchIfMissing 都是 true）。用不到的五个必须显式关掉：
  ai:
    tools:
      limits:
        # 超限的默认行为是 THROW，而 Advisor 会把那句英文超限文案（"Tool call limit (N)
        # exceeded..."）当成助手回答返回——它会被当成正常回复落进 ai_message。
        # 改成回一条错误结果，让模型自己收尾。
        on-limit-exceeded: return-error-response
        # 单轮上限。一次「检索 + 读正文」最多也就 4 次调用，给到 4 已经宽裕
        max-calls-per-tool-default: 4
        max-total-tool-calls: 6
    openai:
      # 缺 key 时整个上下文起不来，但可以留空：
      # 留空时 chat 客户端照样构造成功（它不在启动时校验凭据），只有真去调用才失败 → 50300（§6.8）。
      api-key: ${JOTANG_AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-flash
        # 单条请求超时，默认值本就是 60s，这里显式写出来便于调整。
        # 注意：**没有独立的「连接超时」开关**，要单设得自己定制 SDK client（§7.1 已按实测改口径）。
        timeout: 60s
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# JWT。本机开发由 application-local.yaml 覆盖
jwt:
  secret: ${JWT_SECRET}
  ttl: ${JWT_TTL:2h}

# OSS：AccessKey 不落仓库，一律外部注入。本机开发由 application-local.yaml 覆盖。
# bucket 名与 endpoint 不是秘密，给默认值；部署到非成都地域时用环境变量覆盖即可。
aliyun:
  oss:
    access-key-id: ${JOTANG_OSS_ACCESS_KEY_ID}
    access-key-secret: ${JOTANG_OSS_ACCESS_KEY_SECRET}
    # 服务端访问用的 Endpoint（上传 / 删除）。生产上 ECS 与 OSS 同 Region，用内网：
    # 内网流量免费、不占 ECS 公网出带宽（§1.2、§8.1）。
    # 但内网域名只在阿里云内网可解析——本机开发不在内网，连不通，故由 application-local.yaml 覆写为公网。
    endpoint-server: ${JOTANG_OSS_ENDPOINT_SERVER:oss-cn-chengdu-internal.aliyuncs.com}
    # 浏览器访问用的 Endpoint（签名 URL、头像直读 URL）。生产上也必须是公网，
    # 否则签出来的 URL 主机名指向内网域名，浏览器解析不了（见 OssConfig）。
    endpoint-browser: ${JOTANG_OSS_ENDPOINT_BROWSER:oss-cn-chengdu.aliyuncs.com}
    bucket-note: ${JOTANG_OSS_BUCKET_NOTE:jotang-note}
    bucket-avatar: ${JOTANG_OSS_BUCKET_AVATAR:jotang-avatar}


jotang:
  mail:
    # 发件人。必须与 spring.mail.username（已认证的账号）一致，否则 QQ SMTP 直接拒收
    from: ${JOTANG_MAIL_FROM:${spring.mail.username:}}
    # 重置链接的前端地址前缀，后端只负责在它后面拼 ?token=...。
    # 前端的实际路由尚未定（§10 的「链接文案与倒计时」），故先给一个本机开发用的默认值；
    # 生产用环境变量覆盖。
    reset-link-base: ${JOTANG_MAIL_RESET_LINK_BASE:http://localhost:5173/reset-password}
    # 发信走哪条路：smtp = 同步直发；queue = 投进 RabbitMQ，由消费者发。
    mode: ${JOTANG_MAIL_MODE:queue}

  # 孤儿对象对账：定期把已删除但对象还没清掉的笔记补清一次。
  purge:
    # 上传入库失败后的补偿删除走哪条路：(下面的 enabled 管的是定时对账，两者互不相干。)
    #   none  = 只内联删一次
    #   queue = 额外把这条待办投进 RabbitMQ 兜底，重试耗尽后进死信队列等人工处理
    mode: ${JOTANG_PURGE_MODE:queue}
    # 关掉则 OrphanObjectSweeper 这个 Bean 根本不注册，也就没有定时任务
    enabled: ${JOTANG_PURGE_ENABLED:true}
    # 启动后多久跑第一轮。对账是兜底，晚一小时没有代价，而应用刚起时正忙着建连接池；
    # 顺带让测试上下文里的调度器整个用例期间都不会触发。
    initial-delay: ${JOTANG_PURGE_INITIAL_DELAY:1h}
    # fixedDelay 而非 fixedRate：耗时取决于积压里要打多少次 OSS，后者会让慢的轮次排队
    fixed-delay: ${JOTANG_PURGE_FIXED_DELAY:1h}
    # 一轮最多处理多少条，没做完的下一轮自然接上
    batch-size: ${JOTANG_PURGE_BATCH_SIZE:100}
    # 死信队列深度巡检：非空说明有对象没删掉、在等人处理。只在 mode=queue 时有意义。
    # 比邮箱那条链路便宜得多（一次查询，不打 OSS），所以节奏可以密一些。
    dlq-check:
      initial-delay: ${JOTANG_PURGE_DLQ_CHECK_INITIAL_DELAY:5m}
      fixed-delay: ${JOTANG_PURGE_DLQ_CHECK_FIXED_DELAY:30m}
