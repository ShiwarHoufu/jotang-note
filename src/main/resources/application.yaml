spring:
  application:
    name: jotang-note

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jotang_note}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 库表与基础数据随应用启动初始化；脚本均为幂等，可重复执行
  sql:
    init:
      mode: always
      encoding: UTF-8

# JWT：密钥不落仓库，一律外部注入；本机开发由 application-local.yaml 覆盖 jwt.secret。
# 密钥是 32 字节密钥的 Base64 串（解码后 256 位，恰为 HS256 下限），生成示例：
#   openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET}
  ttl: ${JWT_TTL:2h}
