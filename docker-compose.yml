# 起 RabbitMQ 与 Redis。不含 MySQL：本机已有实例，再起一份会争 3307 端口。
# 将来 MySQL 要迁进来时再单独加 service。
#
# 密码不落仓库，从同目录 .env 读取（Compose 会自动加载该文件）。
# 与 application.yaml 里 jwt.secret / OSS AccessKey 的做法一致：仓库只存占位，
# 真值走本地未跟踪文件。.env 已被 .gitignore 忽略，模板见 .env.example。

services:
  rabbitmq:
    # -management 后缀才带网页管理台（15672）。不带后缀的 rabbitmq:4 没有 UI，
    # 本地开发没有它排查队列会很痛苦。
    image: rabbitmq:4-management
    container_name: rabbitmq
    # 开机 / Docker 重启后自动拉起；手动 docker stop 过的不会被打扰
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP，Spring Boot 连这个
      - "15672:15672"  # 管理台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      # :? 让变量缺失时直接报错退出，而不是静默用空密码起一个连不上的实例
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 .env 或未设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping 只探「节点是否响应」。不探 15672 端口：管理插件比 AMQP 后起，
      # 探端口会让刚就绪的实例被误判为不健康。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要初始化 mnesia 库，这期间失败不计入 retries
      start_period: 40s

  redis:
    # 不设密码：与 application.yaml 里 ${REDIS_PASSWORD:} 的空默认值对齐，本地图省事。
    # 生产那份是另一回事，见 .trae/documents/docker-prod-deploy-plan.md。
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 不挂卷，Redis 在这里只是读缓存，掉了重新查库就是。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  rabbitmq-data:
#    name: rabbitmq-data
