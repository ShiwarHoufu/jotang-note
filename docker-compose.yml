# 起 RabbitMQ 与 Redis。不含 MySQL：本机已有实例，再起一份会争 3307 端口。
# 将来 MySQL 要迁进来时再单独加 service。
#
# 密码不落仓库，从同目录 .env 读取（Compose 会自动加载该文件）。
# 与 application.yaml 里 jwt.secret / OSS AccessKey 的做法一致：仓库只存占位，
# 真值走本地未跟踪文件。.env 已被 .gitignore 忽略，模板见 .env.example。

services:
  rabbitmq:
    # -management 后缀才带网页管理台（15672）。不带后缀的 rabbitmq:4 没有 UI，
    # 本地开发没有它排查队列会很痛苦。
    image: rabbitmq:4-management
    container_name: rabbitmq
    # 开机 / Docker 重启后自动拉起；手动 docker stop 过的不会被打扰
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP，Spring Boot 连这个
      - "15672:15672"  # 管理台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      # :? 让变量缺失时直接报错退出，而不是静默用空密码起一个连不上的实例
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 .env 或未设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping 只探「节点是否响应」。不探 15672 端口：管理插件比 AMQP 后起，
      # 探端口会让刚就绪的实例被误判为不健康。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要初始化 mnesia 库，这期间失败不计入 retries
      start_period: 40s

  redis:
    # 不设密码：与 application.yaml 里 ${REDIS_PASSWORD:} 的空默认值对齐，本地图省事。
    # 生产那份是另一回事，见 .trae/documents/docker-prod-deploy-plan.md。
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 不挂卷，Redis 在这里只是读缓存，掉了重新查库就是。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    # 与 SCA 2025.1.0.0 内置的 nacos-client 3.1.1 对齐；镜像仓库缺这个标签时，
    # 在 .env 里设 NACOS_VERSION=v3.3.0 覆盖即可
    image: nacos/nacos-server:${NACOS_VERSION:-v3.1.1}
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 本机开发关闭鉴权；共享 / 生产环境必须打开，并换掉下面三项
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 的启动脚本即使关闭鉴权也要求这三项存在。下面是官方示例里的开发值，
      # 不是秘密；真要用鉴权时从 .env 覆盖。
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      # Nacos 常驻约 512MB，限住堆避免和 IDE、三个应用抢内存
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"    # HTTP，客户端注册 / 发现
      - "9848:9848"    # gRPC，2.x+ 客户端必需
      - "18080:8080"   # 控制台，避开 jotang-app 的 8080
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  rabbitmq-data:
#    name: rabbitmq-data
  nacos-data:
