# 起 MySQL、RabbitMQ、Redis 与 Nacos。
#
# 密码不落仓库，从同目录 .env 读取（Compose 会自动加载该文件）。

services:
  mysql:
    image: mysql:8.4
    container_name: jotang-mysql
    restart: unless-stopped
    environment:
      # 应用沿用 root 连接；密码从 .env 读取，需与 application-local.yaml 保持一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 .env 或未设置 MYSQL_ROOT_PASSWORD}
      # JDBC URL 与表数据都按 Asia/Shanghai 处理
      TZ: Asia/Shanghai
    ports:
      # 只绑回环：应用都在本机，没必要对局域网暴露
      - "127.0.0.1:3306:3306"
    volumes:
      # 与 Redis 不同，这里是唯一一份业务数据，卷必须保留
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，用于创建三个业务库
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 首次启动要初始化系统库，start_period 给足
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  rabbitmq:
    # -management 后缀才带网页管理台（15672）。不带后缀的 rabbitmq:4 没有 UI，
    # 本地开发没有它排查队列会很痛苦。
    image: rabbitmq:4-management
    container_name: rabbitmq
    # 开机 / Docker 重启后自动拉起；手动 docker stop 过的不会被打扰
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP，Spring Boot 连这个
      - "15672:15672"  # 管理台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      # :? 让变量缺失时直接报错退出，而不是静默用空密码起一个连不上的实例
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 .env 或未设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping 只探「节点是否响应」。不探 15672 端口：管理插件比 AMQP 后起，
      # 探端口会让刚就绪的实例被误判为不健康。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要初始化 mnesia 库，这期间失败不计入 retries
      start_period: 40s

  redis:
    # 不设密码：与 application.yaml 里 ${REDIS_PASSWORD:} 的空默认值对齐，本地图省事。
    # 生产那份是另一回事，见 .trae/documents/docker-prod-deploy-plan.md。
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 不挂卷，Redis 在这里只是读缓存，掉了重新查库就是。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    # 与 SCA 2025.1.0.0 内置的 nacos-client 3.1.1 对齐；镜像仓库缺这个标签时，
    # 在 .env 里设 NACOS_VERSION=v3.3.0 覆盖即可
    image: nacos/nacos-server:${NACOS_VERSION:-v3.1.1}
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 本机开发关闭鉴权；共享 / 生产环境必须打开，并换掉下面三项
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 的启动脚本即使关闭鉴权也要求这三项存在。下面是官方示例里的开发值，
      # 不是秘密；真要用鉴权时从 .env 覆盖。
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      # Nacos 常驻约 512MB，限住堆避免和 IDE、三个应用抢内存
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"    # HTTP，客户端注册 / 发现
      - "9848:9848"    # gRPC，2.x+ 客户端必需
      - "18080:8080"   # 控制台，避开 note-app 的 8080
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  mysql-data:
  rabbitmq-data:
#    name: rabbitmq-data
  nacos-data:
