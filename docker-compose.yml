# 起 MySQL、RabbitMQ、Redis、Nacos 与 Qdrant。
#
# 密码不落仓库，从同目录 .env 读取（Compose 会自动加载该文件）。

services:
  mysql:
    image: mysql:8.4
    container_name: jotang-mysql
    restart: unless-stopped
    environment:
      # 应用沿用 root 连接；密码从 .env 读取，需与 application-local.yaml 保持一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 .env 或未设置 MYSQL_ROOT_PASSWORD}
      # JDBC URL 与表数据都按 Asia/Shanghai 处理
      TZ: Asia/Shanghai
    ports:
      # 只绑回环：应用都在本机，没必要对局域网暴露
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，用于创建三个业务库
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 首次启动要初始化系统库，start_period 给足
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  rabbitmq:
    # -management 后缀才带网页管理台（15672）。不带后缀的 rabbitmq:4 没有 UI，
    # 本地开发没有它排查队列会很痛苦。
    image: rabbitmq:4-management
    container_name: rabbitmq
    # 开机 / Docker 重启后自动拉起；手动 docker stop 过的不会被打扰
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP，Spring Boot 连这个
      - "15672:15672"  # 管理台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      # :? 让变量缺失时直接报错退出，而不是静默用空密码起一个连不上的实例
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 .env 或未设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping 只探「节点是否响应」。不探 15672 端口：管理插件比 AMQP 后起，
      # 探端口会让刚就绪的实例被误判为不健康。
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要初始化 mnesia 库，这期间失败不计入 retries
      start_period: 40s

  redis:
    # 不设密码：与 application.yaml 里 ${REDIS_PASSWORD:} 的空默认值对齐，本地省事。
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 不挂卷：读缓存丢了重查；
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    # 本地已有 qdrant/qdrant:latest，直接用
    image: qdrant/qdrant:latest
    container_name: jotang-qdrant
    restart: unless-stopped
    ports:
      # 只绑回环：应用都在本机。6333 是 HTTP 与控制台，6334 是 gRPC（Spring AI 客户端）
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # 向量索引是可重建的派生数据；但重建要重跑 embedding，本地还是留着省事
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl/wget，只能用 bash 的 /dev/tcp 探端口
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    # 与 SCA 2025.1.0.0 内置的 nacos-client 3.1.1 对齐；镜像仓库缺这个标签时，
    # 在 .env 里设 NACOS_VERSION=v3.3.0 覆盖即可
    image: nacos/nacos-server:${NACOS_VERSION:-v3.1.1}
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 开启鉴权：配置 API 与控制台都需要登录；客户端用 spring.cloud.nacos.username/password
      NACOS_AUTH_ENABLE: "true"
      # 三项必须有值：token 为 Base64 编码、解码后至少 32 字节；identity 两侧保持一致
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?缺少 .env 或未设置 NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?缺少 .env 或未设置 NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?缺少 .env 或未设置 NACOS_AUTH_IDENTITY_VALUE}
      # Nacos 常驻约 512MB，限住堆避免和 IDE、三个应用抢内存
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"    # HTTP，客户端注册 / 发现
      - "9848:9848"    # gRPC，2.x+ 客户端必需
      - "18080:8080"   # 控制台，避开 note-app 的 8080
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  mysql-data:
  rabbitmq-data:
  nacos-data:
  qdrant-data:
