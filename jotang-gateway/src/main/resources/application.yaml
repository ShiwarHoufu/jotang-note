server:
  port: ${GATEWAY_SERVER_PORT:8088}

spring:
  application:
    name: jotang-gateway

  # 共享配置在前，服务配置在后（后者覆盖前者）
  config:
    import:
      - nacos:jotang-shared.yaml?group=JOTANG
      - nacos:jotang-gateway.yaml?group=JOTANG

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      # 必须在 spring.config.import 解析前可见，故不能只放 application-local.yaml
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        # 网关只发现别人，不把自己注册进注册表
        register-enabled: false
